    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const particles = document.querySelectorAll('.particle');
            particles.forEach(particle => {
                const randomX = Math.random();
                const randomDelay = Math.random() * 2.5;
                const randomDuration = 1.5 + Math.random() * 2;
                const randomSize = 1.5 + Math.random() * 2.5;

                particle.style.width = `${randomSize}px`;
                particle.style.height = `${randomSize}px`;
                particle.style.left = `${randomX * 100}%`;
                particle.style.top = '70%';

                particle.style.animationDelay = `${randomDelay}s`;
                particle.style.animationDuration = `${randomDuration}s`;
                particle.style.setProperty('--rand-x', randomX);

                particle.style.animationName = 'particle-float';
                particle.style.animationIterationCount = 'infinite';
                particle.style.animationTimingFunction = 'ease-out';
            });
        });

        const titleText = "Rush_YT8";
        let titleIndex = 0;
        let isDeleting = false;
        const animatedTitleEl = document.getElementById('animatedTitle');

        function animateTitle() {
            if (!isDeleting) {
                animatedTitleEl.textContent = titleText.substring(0, titleIndex + 1);
                document.title = "@" + titleText.substring(0, titleIndex + 1);
                titleIndex++;
                if (titleIndex === titleText.length) {
                    isDeleting = true;
                    setTimeout(animateTitle, 2000);
                    return;
                }
            } else {
                animatedTitleEl.textContent = titleText.substring(0, titleIndex - 1);
                document.title = "@" + titleText.substring(0, titleIndex - 1);
                titleIndex--;
                if (titleIndex === 0) {
                    isDeleting = false;
                }
            }
            setTimeout(animateTitle, isDeleting ? 150 : 250);
        }
        animateTitle();

        const video = document.getElementById('bgVideo');
        const muteBtn = document.getElementById('muteBtn');
        const muteIcon = document.getElementById('muteIcon');

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progress = document.getElementById('progress');
        const timeBar = document.getElementById('timeBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        let isMuted = false;

        muteBtn.addEventListener('click', () => {
            isMuted = !isMuted;
            audio.muted = isMuted;
            video.muted = isMuted;

            if (isMuted) {
                muteIcon.className = 'fa-solid fa-volume-xmark';
            } else {
                muteIcon.className = 'fa-solid fa-volume-high';
            }
        });

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.className = 'fa-solid fa-pause';
            } else {
                audio.pause();
                playBtn.className = 'fa-solid fa-play';
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progress.style.width = percent + '%';
                
                let curMins = Math.floor(audio.currentTime / 60);
                let curSecs = Math.floor(audio.currentTime % 60);
                if (curSecs < 10) curSecs = '0' + curSecs;
                currentTimeEl.textContent = `${curMins}:${curSecs}`;

                let durMins = Math.floor(audio.duration / 60);
                let durSecs = Math.floor(audio.duration % 60);
                if (durSecs < 10) durSecs = '0' + durSecs;
                durationEl.textContent = `${durMins}:${durSecs}`;
            }
        });

        timeBar.addEventListener('click', (e) => {
            const width = timeBar.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        const counterNamespace = "rush_yt8_site";
        const counterKey = "page_views";

        if (!localStorage.getItem('has_visited')) {
            fetch(`https://api.countapi.xyz/hit/${counterNamespace}/${counterKey}`)
                .then(res => res.json())
                .then(res => {
                    document.getElementById('visits-count').innerText = res.value;
                    localStorage.setItem('has_visited', 'true');
                }).catch(() => {
                    document.getElementById('visits-count').innerText = '1';
                });
        } else {
            fetch(`https://api.countapi.xyz/get/${counterNamespace}/${counterKey}`)
                .then(res => res.json())
                .then(res => {
                    document.getElementById('visits-count').innerText = res.value;
                }).catch(() => {
                    document.getElementById('visits-count').innerText = '1';
                });
        }

        /* АНИМАЦИЯ FAVICON: ☆ → ✩ → ✧ → ✩ → ☆ */
        const favicon = document.getElementById('favicon');

        const faviconFrames = [
            '☆',
            '✩',
            '✧',
            '✩',
            '☆'
        ];

        let faviconFrame = 0;

        function animateFavicon() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;

            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, 64, 64);

            ctx.font = '52px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            /* Необычный цвет: фиолетовый + бирюзовое свечение */
            ctx.fillStyle = '#b45cff';
            ctx.shadowColor = '#00f5ff';
            ctx.shadowBlur = 15;

            ctx.fillText(faviconFrames[faviconFrame], 32, 34);

            favicon.href = canvas.toDataURL('image/png');

            faviconFrame = (faviconFrame + 1) % faviconFrames.length;
        }

        animateFavicon();
        setInterval(animateFavicon, 180);
    </script>
